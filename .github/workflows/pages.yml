name: Deploy static KKuTu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare original KKuTu static site
        run: |
          rm -rf _site
          mkdir -p _site

          # Keep the original KKuTu frontend resources intact: CSS, images,
          # fonts, sounds and other public assets.
          cp -R Server/lib/Web/public/. _site/

          # Overlay only the serverless entry point/runtime.
          cp -R static/. _site/

          # Original CSS was served from the domain root. Pages project sites
          # live under /<repo>/, so only root image URLs need to become relative.
          find _site/css -type f -name '*.css' -exec sed -i \
            -e "s|url('/img/|url('../img/|g" \
            -e 's|url("/img/|url("../img/|g' \
            -e 's|url(/img/|url(../img/|g' {} +

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
